<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simplesphere OS — Real Estate CRM</title>
  
  <!-- Modern Typography: Google Fonts Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/theme.css?v=2">
  <link rel="stylesheet" href="/css/styles.css?v=2">
  <link rel="stylesheet" href="/css/floorplan.css?v=2">
  <link rel="stylesheet" href="/css/voice-agent.css?v=2">
</head>
<body>

  <div class="app-container">
    
    <!-- Collapsible Left Sidebar Module Selector (Icons-only when collapsed, expands on hover) -->
    <aside class="sidebar-rail" id="sidebar-rail">
      <div class="rail-top">
        <!-- Brand Header inside sidebar -->
        <div class="rail-brand" onclick="window.store.setTab('overview')" title="Simplesphere OS">
          <div class="rail-brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <ellipse cx="12" cy="12" rx="9" ry="4"/>
              <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="rail-brand-text">
            <span class="rail-brand-title">Simplesphere OS</span>
            <span class="rail-brand-sub">Real Estate CRM</span>
          </div>
        </div>

        <div class="rail-divider"></div>

        <nav class="rail-nav">
          <button class="rail-nav-btn active" data-tab="overview" title="Overview Cockpit">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            </span>
            <span class="nav-label">Overview Cockpit</span>
          </button>
          <button class="rail-nav-btn" data-tab="inventory" title="Inventory Matrix">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M12 14h.01"/></svg>
            </span>
            <span class="nav-label">Inventory Matrix</span>
          </button>
          <button class="rail-nav-btn" data-tab="pipeline" title="Sales Pipeline">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg>
            </span>
            <span class="nav-label">Sales Pipeline</span>
          </button>
          <button class="rail-nav-btn" data-tab="cost-sheets" title="Dynamic Cost Sheets">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M6 15h2"/><path d="M10 15h6"/></svg>
            </span>
            <span class="nav-label">Dynamic Cost Sheets</span>
          </button>
          <button class="rail-nav-btn" data-tab="site-visits" title="Site Visits & Field Ops">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
            </span>
            <span class="nav-label">Site Visits & Field Ops</span>
          </button>
          <button class="rail-nav-btn" data-tab="post-sales" title="Post-Sales & CLP">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
            </span>
            <span class="nav-label">Post-Sales & CLP</span>
          </button>
          <button class="rail-nav-btn" data-tab="campaigns" title="Marketing Attribution">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            </span>
            <span class="nav-label">Marketing & ROI</span>
          </button>
          <button class="rail-nav-btn" data-tab="channel-partners" title="Channel Partner Portal">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span class="nav-label">Channel Partners</span>
          </button>
          <button class="rail-nav-btn" data-tab="cx-portal" title="Homebuyer CX Portal">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <span class="nav-label">Homebuyer Portal</span>
          </button>
          <button class="rail-nav-btn" data-tab="jarvis-voice" title="Jarvis AI Voice Bot">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
            </span>
            <span class="nav-label">AI Telephony Bot</span>
          </button>
          <button class="rail-nav-btn" data-tab="floorplans" title="Floor Plans & 3D Tour">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            </span>
            <span class="nav-label">3D Floor Plans</span>
          </button>
          <button class="rail-nav-btn" data-tab="iris-war-room" title="IRIS Launch War Room">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </span>
            <span class="nav-label">IRIS War Room</span>
          </button>
          <button class="rail-nav-btn" data-tab="mcp-inspector" title="MCP Server Inspector">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
            <span class="nav-label">MCP Inspector</span>
          </button>
        </nav>
      </div>

      <div class="rail-bottom">
        <button class="rail-nav-btn" id="theme-toggle-btn" title="Light Theme Active">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </span>
          <span class="nav-label">Light Theme</span>
        </button>
        <button class="rail-nav-btn" id="reset-demo-btn" title="Reset Demo Data">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </span>
          <span class="nav-label">Reset Demo Data</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="main-wrapper">
      
      <!-- Top Navigation Header Bar (Center module selector removed; left sidebar is primary selector) -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-brand-display" onclick="window.store.setTab('overview')">
            <div class="topbar-brand-badge-dot"></div>
            <span class="topbar-brand-title">Simplesphere OS</span>
            <span class="topbar-brand-sub">Real Estate CRM</span>
          </div>
          <div class="topbar-breadcrumb">
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-active" id="topbar-active-module">Overview Cockpit</span>
          </div>
        </div>

        <!-- Right Utilities & Profile Persona -->
        <div class="topbar-right">
          <!-- Active Project Select Pill -->
          <select id="topbar-project-select" class="project-pill-select">
            <option value="proj-solitaire">The Grand Solitaire (Worli, Mumbai)</option>
            <option value="proj-aurelia">Aurelia Greenfields (Whitefield, BLR)</option>
          </select>

          <!-- Utilities Icons Group -->
          <div class="utility-pills-group">
            <button class="utility-icon-btn" title="Search Everything (Ctrl+K)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="utility-icon-btn" title="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="unread-dot"></span>
            </button>
            <button class="utility-icon-btn" title="System Status: Concurrency Grid Active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
          </div>

          <!-- Persona Profile Pill with Role Switcher -->
          <div class="persona-pill" onclick="document.getElementById('topbar-role-select').focus()">
            <div class="persona-avatar">VM</div>
            <div class="persona-info">
              <span class="persona-name" id="display-persona-name">Vikram Malhotra</span>
              <select id="topbar-role-select" style="border: none; background: transparent; font-size: 11px; color: var(--text-muted); cursor: pointer; outline: none; padding: 0;">
                <option value="admin">Admin / MD</option>
                <option value="vp_sales">VP Sales (Ananya Sharma)</option>
                <option value="sales_rep">Sales Rep (Priya Kulkarni)</option>
                <option value="post_sales">Post-Sales Officer (Sneha Patel)</option>
                <option value="cp_broker">CP Broker (Rajesh Gupta)</option>
                <option value="homebuyer">Homebuyer (Arjun Singhania)</option>
              </select>
            </div>
          </div>

          <!-- Signature Coral Action Pill Button -->
          <button class="btn btn-coral btn-sm" onclick="window.openNewLeadModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Fast Inbound Lead</span>
          </button>
        </div>
      </header>

      <!-- Greeting & Executive Actions Banner (Displayed on Overview Dashboard) -->
      <section class="greeting-row" id="greeting-row-section">
        <div class="greeting-text">
          <h2>Good morning, <span id="greeting-persona-name">Vikram</span></h2>
          <p>Stay on top of your projects, monitor inventory velocity, and track revenue collections.</p>
        </div>

        <div class="greeting-actions">
          <button class="btn btn-secondary btn-sm" onclick="window.openLeadRoutingModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Lead Routing & Capacity
          </button>
          <button class="btn btn-secondary btn-sm" onclick="window.openReportsExportModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Center
          </button>
          <button class="btn btn-secondary btn-sm" onclick="window.openProjectConfigModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Project & Tower Setup
          </button>
        </div>
      </section>

      <!-- Viewport Root: Rendered dynamically based on active tab -->
      <div id="main-content-viewport" class="content-viewport">
        <!-- Rendered by app.js router -->
      </div>

    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/components/overview-dashboard.js"></script>
  <script src="/js/components/inventory-matrix.js"></script>
  <script src="/js/components/cost-sheet-modal.js"></script>
  <script src="/js/components/booking-modal.js"></script>
  <script src="/js/components/kanban-pipeline.js"></script>
  <script src="/js/components/lead-detail-modal.js"></script>
  <script src="/js/components/dialer-modal.js"></script>
  <script src="/js/components/cp-portal.js"></script>
  <script src="/js/components/post-sales.js"></script>
  <script src="/js/components/cx-portal.js"></script>
  <script src="/js/components/site-visits-view.js"></script>
  <script src="/js/components/campaigns-view.js"></script>
  <script src="/js/components/lead-routing-modal.js"></script>
  <script src="/js/components/reports-export-modal.js"></script>
  <script src="/js/components/communication-modal.js"></script>
  <script src="/js/components/iris-war-room.js"></script>
  <script src="/js/components/analytics-cockpit.js"></script>
  <script src="/js/components/mcp-inspector.js"></script>
  <script src="/js/components/new-lead-modal.js"></script>
  <script src="/js/components/floorplan-viewer.js"></script>
  <script src="/js/components/demand-notice-modal.js"></script>
  <script src="/js/components/handover-noc-modal.js"></script>
  <script src="/js/components/cancellation-modal.js"></script>
  <script src="/js/components/project-configurator-modal.js"></script>
  <script src="/js/components/jarvis-voice-agent.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
